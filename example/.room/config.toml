# The dashboard's settings for this project. Every key is optional, and this file lists all of them:
# a key that is not here stops the dashboard with a message, so a misspelt key is never read as "not set".

name = "Example"                   # page titles. Default: the project folder's name.
title = "An example project"       # the room's brand and the overview's heading. Default: name.
floor = "2026-01-01"               # the hosted copy shows only files dated from this day on. Default: every file.
marks_from = "2026-01-01"          # --labels-todo asks for an importance mark on figures read since. Default: all.
people = ["Owner", "Coauthor"]     # names offered as note owners; the first is the room's owner. Default: none.

[hosted]                           # only for --publish and the web room (--public). Without it both refuse.
project = "example"                # the Cloudflare Pages project
hosts = ["room.example.org", "example.pages.dev"]  # the hosts the Access application covers
access_team = "example"            # <team>.cloudflareaccess.com
emails = ["owner@example.org"]     # who may use the web room with the Claude panel
env_file = "~/.config/cloudflare/example.env"      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, if you have no wrangler login

[claude]
prompt_file = ".room/claude-prompt.md"  # lines added to the Claude panel's instructions

[siblings]
codebooks = "../codebooks"         # a folder beside the project whose *_en.md tables define the data's field names
